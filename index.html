<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dthinh.EXE</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #0d0b1a;
        color: #fff;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        background-image:
        radial-gradient(ellipse at 20% 20%, rgba(120,40,200,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(40,80,200,0.1) 0%, transparent 50%);
        padding-bottom: 40px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        position: sticky;
        top: 0;
        background: rgba(13,11,26,0.9);
        backdrop-filter: blur(12px);
        z-index: 100;
        border-bottom: 1px solid rgba(255,255,255,0.05);
      }

      .topbar-time {
        background: rgba(255,255,255,0.08);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
      }

      .topbar-icons { display: flex; gap: 8px; }

      .icon-btn {
        width: 36px; height: 36px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .icon-btn.notif { background: #2a1a4a; position: relative; }
      .icon-btn.notif::after {
        content: '';
        position: absolute;
        top: 6px; right: 6px;
        width: 7px; height: 7px;
        background: #ff4466;
        border-radius: 50%;
      }
      .icon-btn.menu { background: #3a1a6a; }

      .hero {
        text-align: center;
        padding: 40px 16px 28px;
      }

      .avatar-wrap {
        position: relative;
        width: 100px; height: 100px;
        margin: 0 auto 14px;
      }

      .avatar-glow {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #ff2244, #cc44ff, #4466ff, #ff2244);
        animation: spin 3s linear infinite;
        filter: blur(6px);
        opacity: 0.7;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .avatar-img {
        width: 100px; height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2a1a4a, #1a1a3a);
        border: 3px solid #0d0b1a;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }

      .verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 14px;
      }

      .verified-badge .check {
        background: #4488ff;
        border-radius: 50%;
        width: 16px; height: 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px;
      }

      .hero-title {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 6px;
        background: linear-gradient(135deg, #cc88ff, #ffffff, #cc88ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
      }

      .hero-title::before,
      .hero-title::after {
        content: '⬛';
        font-size: 18px;
        background: linear-gradient(135deg, #cc88ff, #fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 10px;
      }

      .blood-drops {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .drop {
        width: 3px;
        background: linear-gradient(to bottom, #cc0022, transparent);
        border-radius: 0 0 3px 3px;
        animation: drip 2s ease-in-out infinite;
      }

      .drop:nth-child(1) { height: 14px; animation-delay: 0s; }
      .drop:nth-child(2) { height: 20px; animation-delay: 0.3s; }
      .drop:nth-child(3) { height: 12px; animation-delay: 0.6s; }

      @keyframes drip {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .filter-wrap { padding: 0 16px 16px; }

      .filter-tab {
        display: inline-flex;
        padding: 9px 22px;
        border-radius: 20px;
        background: linear-gradient(135deg, #6633cc, #4422aa);
        border: 1px solid #8855ee;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .items {
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .item-card {
        background: linear-gradient(135deg, rgba(60,20,100,0.4), rgba(20,20,60,0.4));
        border: 1px solid rgba(120,60,200,0.2);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        transition: border-color 0.2s;
      }

      .item-card:active { border-color: rgba(180,100,255,0.4); }

      .item-thumb {
        width: 52px; height: 52px;
        border-radius: 12px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }

      .item-info {
        flex: 1;
        min-width: 0;
      }

      .item-title {
        font-size: 15px;
        font-weight: 700;
        color: #FFFFFF;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-sub {
        font-size: 12px;
        color: rgba(255,255,255,0.55);
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        white-space: normal;
        margin-bottom: 6px;
      }

      .item-tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 6px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.7);
        letter-spacing: 0.5px;
      }

      .item-action {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>

    <script>
      function updateClock() {
        var now = new Date();
        var h = now.getHours().toString().padStart(2,'0');
        var m = now.getMinutes().toString().padStart(2,'0');
        var s = now.getSeconds().toString().padStart(2,'0');
        document.getElementById('clock').textContent = '🌙 ' + h + ':' + m + ':' + s;
      }
      updateClock();
      setInterval(updateClock, 1000);
    </script>
  </body>
</html>
